<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // 마지막에 고른 테마를 화면을 그리기 전에 적용한다 (처음에는 어두운 화면)
      try { document.documentElement.dataset.theme = localStorage.getItem('aitalk.theme') === 'light' ? 'light' : 'dark'; }
      catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
    <title>AI-Talk</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
